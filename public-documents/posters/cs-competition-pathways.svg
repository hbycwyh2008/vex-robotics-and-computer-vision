<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect width="1240" height="1754" fill="#F7FBFF"/>
<style>.title{font-family:Arial,sans-serif;font-weight:900;fill:#0B3A75}.sub{font-family:Arial,sans-serif;font-weight:700;fill:#31516D}.h{font-family:Arial,sans-serif;font-weight:900;font-size:35px}.b{font-family:Arial,sans-serif;font-size:25px;fill:#24394E}.tag{font-family:Arial,sans-serif;font-weight:800;font-size:23px;fill:#FFFFFF}</style>
<text x="620" y="118" text-anchor="middle" class="title" font-size="76">CS COMPETITION PATHWAYS</text>
<text x="620" y="176" text-anchor="middle" class="sub" font-size="29">Optional enrichment beyond the core course</text>
<text x="620" y="222" text-anchor="middle" class="sub" font-size="23">Choose a pathway that matches your interests. Competitions are opportunities to apply and extend mastery.</text>
<g transform="translate(80,285)">
<rect width="520" height="475" rx="34" fill="#EEF5FF" stroke="#0B6BCB" stroke-width="4"/>
<rect x="36" y="36" width="448" height="64" rx="18" fill="#0B6BCB"/><text x="260" y="79" text-anchor="middle" class="tag">PROGRAMMING &amp; COMPUTATIONAL THINKING</text>
<text x="48" y="165" class="h" fill="#0B6BCB">Build algorithmic strength</text>
<text x="55" y="225" class="b">• BEBRAS</text><text x="55" y="275" class="b">• ACSL</text><text x="55" y="325" class="b">• USACO</text>
<text x="55" y="390" class="b">Focus: logic, algorithms, problem solving,</text><text x="55" y="425" class="b">coding accuracy, and computational thinking.</text>
</g>
<g transform="translate(640,285)">
<rect width="520" height="475" rx="34" fill="#F5F0FF" stroke="#7E57C2" stroke-width="4"/>
<rect x="36" y="36" width="448" height="64" rx="18" fill="#7E57C2"/><text x="260" y="79" text-anchor="middle" class="tag">CYBERSECURITY</text>
<text x="48" y="165" class="h" fill="#6A45B5">Think like a defender</text>
<text x="55" y="225" class="b">• picoCTF</text><text x="55" y="275" class="b">• CyberPatriot</text><text x="55" y="325" class="b">• CTF challenges</text>
<text x="55" y="390" class="b">Focus: systems, networks, vulnerabilities,</text><text x="55" y="425" class="b">defense, investigation, and ethical security.</text>
</g>
<g transform="translate(80,805)">
<rect width="520" height="475" rx="34" fill="#ECF9F0" stroke="#3FAE63" stroke-width="4"/>
<rect x="36" y="36" width="448" height="64" rx="18" fill="#3FAE63"/><text x="260" y="79" text-anchor="middle" class="tag">AI &amp; DATA SCIENCE</text>
<text x="48" y="165" class="h" fill="#2D8E4D">Build with data and models</text>
<text x="55" y="225" class="b">• IOAI</text><text x="55" y="275" class="b">• Kaggle</text><text x="55" y="325" class="b">• Applied AI projects</text>
<text x="55" y="390" class="b">Focus: data, machine learning, evaluation,</text><text x="55" y="425" class="b">AI systems, responsible use, and evidence.</text>
</g>
<g transform="translate(640,805)">
<rect width="520" height="475" rx="34" fill="#FFF6E8" stroke="#F39C12" stroke-width="4"/>
<rect x="36" y="36" width="448" height="64" rx="18" fill="#F39C12"/><text x="260" y="79" text-anchor="middle" class="tag">ROBOTICS &amp; ENGINEERING</text>
<text x="48" y="165" class="h" fill="#D98200">Design, test, and compete</text>
<text x="55" y="225" class="b">• VEX Robotics</text><text x="55" y="275" class="b">• FIRST</text><text x="55" y="325" class="b">• Computer vision / intelligent robotics</text>
<text x="55" y="390" class="b">Focus: mechanisms, programming, control,</text><text x="55" y="425" class="b">strategy, iteration, reliability, and teamwork.</text>
</g>
<rect x="120" y="1340" width="1000" height="200" rx="30" fill="#0B3A75"/>
<text x="620" y="1405" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="34" fill="white">COMPETITIONS ARE OPTIONAL — MASTERY COMES FIRST</text>
<text x="620" y="1460" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="white">Use competitions to stretch your skills, build portfolio evidence,</text>
<text x="620" y="1498" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="white">and apply classroom learning to authentic challenges.</text>
<text x="620" y="1640" text-anchor="middle" class="sub" font-size="25">Explore one pathway deeply — you do not need to do everything.</text>
</svg>