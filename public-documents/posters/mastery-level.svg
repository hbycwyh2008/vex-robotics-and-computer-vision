<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect width="1240" height="1754" fill="#F6FAFF"/>
<style>
.t{font-family:Arial,sans-serif;font-weight:900;fill:#0B3A75}.s{font-family:Arial,sans-serif;font-weight:700;fill:#23415F}.h{font-family:Arial,sans-serif;font-weight:900;font-size:31px}.b{font-family:Arial,sans-serif;font-size:23px;fill:#24384D}.n{font-family:Arial,sans-serif;font-weight:900;font-size:46px;fill:white}
</style>
<text x="620" y="115" text-anchor="middle" class="t" font-size="82">MASTERY LEVEL</text>
<text x="620" y="170" text-anchor="middle" class="s" font-size="30">Not Just Working Once. Real Understanding.</text>
<text x="620" y="225" text-anchor="middle" class="s" font-size="24">Explain · Rebuild · Debug · Modify · Transfer</text>
<g transform="translate(100,285)">
<rect width="1040" height="190" rx="28" fill="white" stroke="#AAB7C4" stroke-width="3"/><circle cx="85" cy="95" r="48" fill="#7A8794"/><text x="85" y="111" text-anchor="middle" class="n">0</text><text x="165" y="76" class="h" fill="#56616C">EXPOSURE</text><text x="165" y="119" class="b">I have seen the concept, build, code pattern, or demonstration.</text><text x="165" y="153" class="b">Seeing it is the start — not mastery.</text>
</g>
<g transform="translate(100,500)">
<rect width="1040" height="190" rx="28" fill="white" stroke="#0B6BCB" stroke-width="3"/><circle cx="85" cy="95" r="48" fill="#0B6BCB"/><text x="85" y="111" text-anchor="middle" class="n">1</text><text x="165" y="76" class="h" fill="#0B6BCB">FOLLOW &amp; MAKE IT WORK</text><text x="165" y="119" class="b">I can follow instructions or a provided example and make the system work.</text><text x="165" y="153" class="b">Working once does not prove independent understanding.</text>
</g>
<g transform="translate(100,715)">
<rect width="1040" height="190" rx="28" fill="white" stroke="#13A6A6" stroke-width="3"/><circle cx="85" cy="95" r="48" fill="#13A6A6"/><text x="85" y="111" text-anchor="middle" class="n">2</text><text x="165" y="76" class="h" fill="#0C8A8A">EXPLAIN WHILE LOOKING</text><text x="165" y="119" class="b">I can look at the robot, code, diagram, or evidence and explain the important parts.</text><text x="165" y="153" class="b">I understand what the pattern is doing and why.</text>
</g>
<g transform="translate(100,930)">
<rect width="1040" height="190" rx="28" fill="white" stroke="#4CAF50" stroke-width="3"/><circle cx="85" cy="95" r="48" fill="#4CAF50"/><text x="85" y="111" text-anchor="middle" class="n">3</text><text x="165" y="76" class="h" fill="#388E3C">REBUILD WITH A CHECKLIST</text><text x="165" y="119" class="b">I can recreate the pattern using a short checklist — without copying the full solution.</text><text x="165" y="153" class="b">This is the typical minimum target for many core skills.</text>
</g>
<g transform="translate(100,1145)">
<rect width="1040" height="190" rx="28" fill="white" stroke="#F39C12" stroke-width="3"/><circle cx="85" cy="95" r="48" fill="#F39C12"/><text x="85" y="111" text-anchor="middle" class="n">4</text><text x="165" y="76" class="h" fill="#D98200">REBUILD INDEPENDENTLY</text><text x="165" y="119" class="b">I can recreate the core skill from a blank starting point without full instructions.</text><text x="165" y="153" class="b">I can validate that it actually works.</text>
</g>
<g transform="translate(100,1360)">
<rect width="1040" height="210" rx="28" fill="white" stroke="#7E57C2" stroke-width="4"/><circle cx="85" cy="105" r="48" fill="#7E57C2"/><text x="85" y="121" text-anchor="middle" class="n">5</text><text x="165" y="80" class="h" fill="#6A45B5">MODIFY · DEBUG · TRANSFER</text><text x="165" y="125" class="b">I can diagnose failure, improve the system using evidence, and adapt the pattern</text><text x="165" y="159" class="b">to a new situation or engineering challenge.</text>
</g>
<rect x="120" y="1605" width="1000" height="90" rx="22" fill="#0B3A75"/><text x="620" y="1660" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="26" fill="white">A finished robot is not enough. Be able to explain, rebuild, test, and improve it.</text>
</svg>