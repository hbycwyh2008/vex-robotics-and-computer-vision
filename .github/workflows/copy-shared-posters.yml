name: Copy shared course posters

on:
  push:
    branches:
      - chore/copy-shared-course-posters

permissions:
  contents: write

jobs:
  copy-posters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/copy-shared-course-posters

      - name: Copy official Full-Stack PNG posters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-documents/posters
          base='https://raw.githubusercontent.com/hbycwyh2008/Full-Stack-Web-and-AI-Application-Development/main/08_Public_Documents/posters'
          curl -fL "$base/ai-use-policy.png" -o public-documents/posters/ai-use-policy.png
          curl -fL "$base/classroom-flow.png" -o public-documents/posters/classroom-flow.png
          curl -fL "$base/cs-competition-pathways.png" -o public-documents/posters/cs-competition-pathways.png
          curl -fL "$base/mastery-level.png" -o public-documents/posters/mastery-level.png
          rm -f public-documents/posters/ai-use-policy.svg
          rm -f public-documents/posters/classroom-flow.svg
          rm -f public-documents/posters/cs-competition-pathways.svg
          rm -f public-documents/posters/mastery-level.svg
          sed -i 's/classroom-flow\.svg/classroom-flow.png/g; s/mastery-level\.svg/mastery-level.png/g; s/ai-use-policy\.svg/ai-use-policy.png/g; s/cs-competition-pathways\.svg/cs-competition-pathways.png/g' public-documents/posters/README.md
          sed -i 's/The SVG files are repository-local, printable, and editable classroom assets\./These PNG files are the official shared classroom posters copied from the Full-Stack Web and AI course for visual consistency across courses./' public-documents/posters/README.md

      - name: Commit copied posters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public-documents/posters/README.md \
            public-documents/posters/ai-use-policy.png \
            public-documents/posters/classroom-flow.png \
            public-documents/posters/cs-competition-pathways.png \
            public-documents/posters/mastery-level.png \
            public-documents/posters/ai-use-policy.svg \
            public-documents/posters/classroom-flow.svg \
            public-documents/posters/cs-competition-pathways.svg \
            public-documents/posters/mastery-level.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Replace VEX SVG posters with official shared PNGs'
          git push origin HEAD:chore/copy-shared-course-posters
